name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:

# A newer push supersedes a branch run, but never one that is publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bedrock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Obviously fake values. `next build` parses the production configuration,
    # so every required variable needs one; the tests read the same names with
    # development defaults. Storage and SMTP point nowhere: the suite replaces
    # the mail transport, and root branding upload degrades to a warning.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bedrock
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_ADMIN_NAME: CI Admin
      S3_REGION: us-east-1
      S3_BUCKET: bedrock-media
      S3_ENDPOINT: http://127.0.0.1:4566
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://127.0.0.1:4566/bedrock-media
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      EMAIL_SENDER_NAME: Bedrock CI
      EMAIL_SENDER_ADDRESS: bedrock@example.test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # `next-env.d.ts` and the route types are generated, not committed.
      - name: Generate route types
        run: bunx next typegen

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run i18n:check
      - run: bun run format:check
      - run: bun run db:migrate
      - run: bun run test

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'features/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - run: bun run build

      # Reported, not yet enforced, because of a known advisory in `sharp`.
      - run: bun run audit
        continue-on-error: true

  # Pull requests build the image without pushing. main publishes `edge` and
  # `sha-<short>`; a version tag publishes the version tags and a release.
  images:
    needs: check
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      push: ${{ github.event_name == 'push' && github.repository == 'LucaWahlen/bedrock' }}

  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'LucaWahlen/bedrock'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          flags=(--generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          notes=$(printf '%s\n' \
            "Image: \`ghcr.io/lucawahlen/bedrock:$version\`" \
            "" \
            "Migrations run when the server starts, unless \`MIGRATE_ON_START=false\`.")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" "${flags[@]}"
