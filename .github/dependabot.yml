version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The base images in `Dockerfile`. Node.js majors are adopted deliberately.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  # The dev container: its `FROM` base image and the features it references.
  # `devcontainers` is what keeps the Bun feature current, since Dependabot's
  # docker ecosystem does not read `ARG` pins.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: weekly
    groups:
      features:
        patterns: ["*"]
