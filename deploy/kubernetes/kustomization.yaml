apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bedrock

labels:
  - pairs:
      app.kubernetes.io/part-of: bedrock

# The Secret is not listed: copy secret.example.yaml to secret.yaml, fill it in,
# and apply it yourself. secret.yaml is git-ignored.
resources:
  - configmap.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - ingress.yaml

# Pin a released version, e.g. 0.1.0. Do not run `edge` in production.
images:
  - name: ghcr.io/lucawahlen/bedrock
    newTag: X.Y.Z
