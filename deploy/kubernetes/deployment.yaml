apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock
  labels:
    app.kubernetes.io/name: bedrock
    app.kubernetes.io/component: server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bedrock
              app.kubernetes.io/component: server
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bedrock
              app.kubernetes.io/component: server
      containers:
        - name: bedrock
          image: ghcr.io/lucawahlen/bedrock
          ports:
            - name: http
              containerPort: 3000
          env:
            # The runtime may set HOSTNAME to the pod name; listen on every
            # interface so probes and the Service both reach the server.
            - name: HOSTNAME
              value: 0.0.0.0
          envFrom:
            - configMapRef:
                name: bedrock-config
            - secretRef:
                name: bedrock-secrets
          # /api/health touches no dependency, so a database outage takes pods
          # out of the Service (readiness) without restarting them (liveness).
          # Start-up applies pending migrations before the server answers, one
          # pod at a time, so allow up to ten minutes for a long one.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 503 until start-up has migrated and set up the instance, and while
          # the database does not answer or lacks a migration this version
          # ships with.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The standalone server writes only its cache; everything else it
          # needs is in the image.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
