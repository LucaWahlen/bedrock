# EXAMPLE ONLY. Copy to secret.yaml (git-ignored), replace every value, and
# apply it with `kubectl apply -f secret.yaml`. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: bedrock-secrets
  namespace: bedrock
type: Opaque
stringData:
  # Any Postgres 16+, e.g. a CloudNativePG cluster's `<cluster>-rw` service.
  DATABASE_URL: postgres://bedrock:REPLACE_ME@bedrock-db-rw:5432/bedrock
  # `openssl rand -base64 32`. Signs sessions and encrypts the OIDC signing
  # keys: changing it later invalidates every session and token.
  BETTER_AUTH_SECRET: REPLACE_ME
  # The first root owner, created on first start. Change the password after
  # signing in.
  SEED_ADMIN_PASSWORD: REPLACE_ME
  S3_ACCESS_KEY_ID: REPLACE_ME
  S3_SECRET_ACCESS_KEY: REPLACE_ME
  # Remove both for a relay that needs no authentication.
  SMTP_USER: REPLACE_ME
  SMTP_PASSWORD: REPLACE_ME
  # Optional, e.g. an authorization header for a hosted OpenTelemetry backend.
  # OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer REPLACE_ME
